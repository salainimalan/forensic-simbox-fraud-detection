<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#172033">Useful forensic differences between SIM groups</text>
  <text x="40" y="64" font-family="Arial, sans-serif" font-size="14" fill="#536174">Median values from the all_naive_12%_200sims scenario; exact values are shown beside each bar.</text>
  <rect x="700" y="22" width="14" height="14" fill="#4f81bd"/><text x="722" y="34" font-family="Arial" font-size="13" fill="#172033">Legitimate median</text>
  <rect x="850" y="22" width="14" height="14" fill="#d86b57"/><text x="872" y="34" font-family="Arial" font-size="13" fill="#172033">Fraudulent median</text>
  <line x1="330" y1="92" x2="930" y2="92" stroke="#cbd3df"/>
  <text x="40" y="124" font-family="Arial" font-size="16" fill="#172033">Total duration</text><rect x="330" y="108" width="80" height="16" fill="#4f81bd"/><rect x="330" y="130" width="316" height="16" fill="#d86b57"/><text x="420" y="121" font-family="Arial" font-size="13">53</text><text x="656" y="143" font-family="Arial" font-size="13">209</text>
  <text x="40" y="184" font-family="Arial" font-size="16" fill="#172033">Activity span</text><rect x="330" y="168" width="80" height="16" fill="#4f81bd"/><rect x="330" y="190" width="500" height="16" fill="#d86b57"/><text x="420" y="181" font-family="Arial" font-size="13">22 s</text><text x="840" y="203" font-family="Arial" font-size="13">48,033 s</text>
  <text x="40" y="244" font-family="Arial" font-size="16" fill="#172033">Unique contacts</text><rect x="330" y="228" width="80" height="16" fill="#4f81bd"/><rect x="330" y="250" width="240" height="16" fill="#d86b57"/><text x="420" y="241" font-family="Arial" font-size="13">1</text><text x="580" y="263" font-family="Arial" font-size="13">3</text>
  <text x="40" y="304" font-family="Arial" font-size="16" fill="#172033">Active hours</text><rect x="330" y="288" width="80" height="16" fill="#4f81bd"/><rect x="330" y="310" width="240" height="16" fill="#d86b57"/><text x="420" y="301" font-family="Arial" font-size="13">1</text><text x="580" y="323" font-family="Arial" font-size="13">3</text>
  <text x="40" y="364" font-family="Arial" font-size="16" fill="#172033">Outgoing share</text><rect x="330" y="348" width="4" height="16" fill="#4f81bd"/><rect x="330" y="370" width="480" height="16" fill="#d86b57"/><text x="340" y="361" font-family="Arial" font-size="13">0</text><text x="820" y="383" font-family="Arial" font-size="13">1.00</text>
  <text x="40" y="424" font-family="Arial" font-size="16" fill="#172033">Observed cell changes</text><rect x="330" y="408" width="80" height="16" fill="#4f81bd"/><rect x="330" y="430" width="160" height="16" fill="#d86b57"/><text x="420" y="421" font-family="Arial" font-size="13">1</text><text x="500" y="443" font-family="Arial" font-size="13">2</text>
  <text x="40" y="484" font-family="Arial" font-size="16" fill="#172033">Outgoing social degree</text><rect x="330" y="468" width="80" height="16" fill="#4f81bd"/><rect x="330" y="490" width="240" height="16" fill="#d86b57"/><text x="420" y="481" font-family="Arial" font-size="13">1</text><text x="580" y="503" font-family="Arial" font-size="13">3</text>
  <text x="40" y="540" font-family="Arial" font-size="13" fill="#536174">Fraudulent SIMs show higher medians across the selected traffic, temporal, mobility, and social indicators.</text>
</svg>
